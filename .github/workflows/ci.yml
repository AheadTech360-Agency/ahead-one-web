name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Dependencies have no known high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  # End-to-end suite (Playwright). Off unless the repository variable E2E_ENABLED is 'true'.
  # Needs the secret API_REPO_TOKEN (read access to AheadTech360-Agency/ahead-one-api).
  e2e:
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_API_BIN: ${{ github.workspace }}/ahead-one-api/target/debug/tasks-api
      E2E_API_DIR: ./ahead-one-api
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/e2e
      AUTH_JWT_SECRET: e2e-only-test-secret-not-for-real-use-0123456789abcdef
      APP_ENV: development
      EMAIL_LOG_BODIES: "1"
      WEB_ORIGIN: http://localhost:3100
      PORT: "8091"
      RUN_JOBS: "false"
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AheadTech360-Agency/ahead-one-api
          token: ${{ secrets.API_REPO_TOKEN }}
          path: ahead-one-api
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ahead-one-api
      - run: cargo build -p server
        working-directory: ahead-one-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/.state/*.log
          retention-days: 7
